div></foreignObject></g></g><g transform="translate(648.4609375, 107)" id="flowchart-KVw-3" class="node default"><rect height="102" width="234.765625" y="-51" x="-117.3828125" style="fill:#dbeafe !important" class="basic label-container"/><g transform="translate(-87.3828125, -36)" style="" class="label"><rect/><foreignObject height="72" width="174.765625"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Write KV cache:<br />K,V for each of N tokens<br />at every layer</p></span></div></foreignObject></g></g><g transform="translate(945.84375, 107)" id="flowchart-Dec-5" class="node default"><rect height="198" width="260" y="-99" x="-130" style="fill:#dcfce7 !important" class="basic label-container"/><g transform="translate(-100, -84)" style="" class="label"><rect/><foreignObject height="168" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>DECODE (loop M times)<br />O(d^2 + N*d) per token<br />sequential, one at a time<br />MEMORY-BANDWIDTH-BOUND<br />read full weights every step</p></span></div></foreignObject></g></g><g transform="translate(1233.8359375, 107)" id="flowchart-KVr-7" class="node default"><rect height="102" width="215.984375" y="-51" x="-107.9921875" style="fill:#dbeafe !important" class="basic label-container"/><g transform="translate(-77.9921875, -36)" style="" class="label"><rect/><foreignObject height="72" width="155.984375"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Read full KV cache<br />+ append 1 new entry<br />per step</p></span></div></foreignObject></g></g><g transform="translate(1483.671875, 107)" id="flowchart-Out-9" class="node default