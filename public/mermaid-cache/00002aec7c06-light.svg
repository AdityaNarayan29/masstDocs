ht="0" width="0"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" class="labelBkg" xmlns="http://www.w3.org/1999/xhtml"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g transform="translate(101.6640625, 335)" id="flowchart-Chunk-0" class="node default"><rect height="54" width="187.328125" y="-27" x="-93.6640625" style="fill:#fef3c7 !important" class="basic label-container"/><g transform="translate(-63.6640625, -12)" style="" class="label"><rect/><foreignObject height="24" width="127.328125"><div style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Chunk size choice</p></span></div></foreignObject></g></g><g transform="translate(375.328125, 71)" id="flowchart-Recall-1" class="node default"><rect height="126" width="260" y="-63" x="-130" style="" class="basic label-container"/><g transform="translate(-100, -48)" style="" class="label"><rect/><foreignObject height="96" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Recall: smaller = more candidates,<br />more chance the right info gets in top-K</p></span></div></foreignObject></g></g><g transform="translate(375.328125, 247)" id="flowchart-Precision-3" class="node default"><rect height="126" width="260" y="-63" x="-130" style="" class="basic label-container"/><g transform="translate(-100, -48)" style="" class="label"><rect/><foreignObject height="96" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>Precision: larger = more context per hit,<br />less noise per token in the LLM prompt</p></span></div></foreig