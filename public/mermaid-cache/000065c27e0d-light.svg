es; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>SLO (Service Level Objective)<br />Internal target<br />Example: 99.9% availability, p99 lt 200ms</p></span></div></foreignObject></g></g><g transform="translate(138, 543)" id="flowchart-SLA-2" class="node default"><rect height="174" width="260" y="-87" x="-130" style="fill:#fef3c7 !important" class="basic label-container"/><g transform="translate(-100, -72)" style="" class="label"><rect/><foreignObject height="144" width="200"><div style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel"><p>SLA (Service Level Agreement)<br />External contract (with consequences)<br />Example: 99.5% uptime or credit issued</p></span></div></foreignObject></g></g></g></g></g></svg>